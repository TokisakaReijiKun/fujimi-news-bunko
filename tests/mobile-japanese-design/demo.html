<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>富士見新聞文庫 · 真实文库界面 Demo</title>
  <link rel="icon" href="data:,">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#e8ebe2;color:#292c28;font:13px/1.8 'Noto Sans SC','Microsoft YaHei',sans-serif}.bar{max-width:1050px;margin:0 auto;height:76px;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}.bar strong{font:18px 'Noto Serif JP','Yu Mincho',serif}.bar span{font-size:11px;color:#66725e}.bar a{color:#8f3027;text-underline-offset:5px}.stage{height:calc(100dvh - 100px);min-height:580px;display:flex;justify-content:center}.device{height:100%;width:392px;border:1px solid #c3c9b8;border-radius:19px;overflow:hidden;background:#faf9f5;box-shadow:0 18px 50px #2938221c}iframe{display:block;border:0;width:100%;height:100%;background:#faf9f5}.note{position:fixed;left:calc(50% + 238px);top:156px;max-width:220px;font-size:12px;color:#69765e;line-height:2}.note b{display:block;color:#3a4632;font-size:14px;font-weight:500;margin-bottom:12px}.note p{margin:12px 0}.note button{font:inherit;background:transparent;border:1px solid #bcc8ae;border-radius:4px;padding:8px 14px;color:inherit;cursor:pointer;min-height:44px}.note button[aria-pressed=true]{background:#d9e1d0}.note label{display:block;margin-bottom:10px}.status{font-size:10px;color:#77816e}@media(max-width:1050px){.note{display:none}.bar>span{max-width:390px}}@media(max-width:600px){.bar{height:38px;padding:0 15px}.bar strong{font-size:12px}.bar>span{display:none}.bar a{font-size:10px}.stage{height:calc(100dvh - 38px);min-height:0}.device{width:100%;max-width:430px;border:0;border-radius:0;box-shadow:none}}
  </style>
</head>
<body>
  <header class="bar"><strong>富士見新聞文庫</strong><span>真实文库 · 新界面预览 · 调整仅保留在预览中</span><a href="index.html">设计稿</a></header>
  <main class="stage"><div class="device"><iframe id="app" src="/native-app.html?edition=2.46#preview/daily" title="真实文库手机界面 Demo"></iframe></div></main>
  <aside class="note"><b>用你的文库，试一试。</b><p>新闻、译文、封面、章节、声线与词典都直接读取当前项目。</p><p>收藏、声线选择与阅读位置的调整仅保存在预览内。</p><label>手机宽度</label><button type="button" data-width="375" aria-pressed="false">375</button> <button type="button" data-width="390" aria-pressed="true">390</button><p class="status" id="connection">正在连接真实文库…</p></aside>
  <script>
    document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{
      document.querySelectorAll('[data-width]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
      document.querySelector('.device').style.width=(Number(button.dataset.width)+2)+'px';
    }));
    fetch('/preview-status').then(response=>{if(!response.ok)throw new Error();return response.json()}).then(()=>{document.querySelector('#connection').textContent='已连接本机正在运行的文库'}).catch(()=>{document.querySelector('#connection').textContent='连接失败，请保持桌面端运行'});
  </script>
</body>
</html>
