      <article class="reading-content"><div class="article-meta"><span>NHKニュース</span><time>2026.11.01</time></div><h1>京都の古い町並みで、<br>秋の色づきが始まる</h1><div class="reading-subtitle">京都古老街巷，渐染秋色</div><div class="reading-byline"><span>社会 · 08:30</span><button type="button" class="text-button" data-dialog="origin">原站打开 ↗</button></div><figure><img src="landscape.svg" alt="秋の町並みのイラスト"><figcaption>秋の朝、町をゆっくり歩く。</figcaption></figure><div class="paragraph"><p lang="ja">京都の<ruby>街<rt>まち</rt></ruby>に、少しずつ秋の色が<ruby>広<rt>ひろ</rt></ruby>がっています。朝の光を受けた木々は、赤や黄色に色づき始めました。</p><p class="translation" lang="zh">京都的街巷，渐渐染上秋日的色彩。沐浴晨光的树木，开始泛起红黄相间的颜色。</p></div><div class="paragraph"><p lang="ja">いつもの道をゆっくり歩くと、<ruby>季節<rt>きせつ</rt></ruby>の小さな変化に気づきます。町の人たちは、それぞれの秋を楽しんでいます。</p><p class="translation" lang="zh">沿着熟悉的小路慢慢走，会发现季节细微的变化。人们享受着属于自己的秋天。</p></div><p class="end-note">以上为合成文章示意。</p></article>

    </div>

  <template id="book">
    <div class="reading-page book-reading-page"><div class="reading-tools"><a href="#library" class="icon-button" aria-label="返回書架"><svg><use href="#i-back"/></svg></a><span>こゝろ</span><button type="button" class="icon-button" data-dialog="contents" aria-label="章节目录"><svg><use href="#i-menu"/></svg></button></div><article class="reading-content book-prose"><p class="book-part">夏目漱石　こゝろ</p><h1>上　先生と私</h1><span class="chapter-number">一</span><p>私はその人を常に先生と呼んでいた。だからここでもただ先生と書くだけで本名は打ち明けない。これは世間を憚かる遠慮というよりも、その方が私にとって自然だからである。</p><p>私はその人の記憶を呼び起こすごとに、すぐ「先生」といいたくなる。筆を執っても心持は同じ事である。よそよそしい頭文字などはとても使う気にならない。</p><p>私が先生と知り合いになったのは鎌倉である。その時私はまだ若々しい書生であった。</p><p class="end-note">公版文本节选 · 阅读版式示意</p></article><div class="book-bottom"><button type="button" class="text-button" data-dialog="contents"><svg><use href="#i-menu"/></svg>目次</button><span>上　先生と私</span><button type="button" class="text-button" data-dialog="audio"><svg><use href="#i-volume"/></svg>朗読</button></div></div>
